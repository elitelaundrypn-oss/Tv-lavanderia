*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#021638}
body{font-family:"Elite Sans","DM Sans","Segoe UI",Roboto,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
body.idle,body.idle *{cursor:none!important}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;
  -webkit-transform-origin:0 0;transform-origin:0 0;background-color:#04245F;
  background-image:radial-gradient(ellipse at 100% 0%,rgba(31,203,249,.20) 0%,rgba(31,203,249,0) 55%),
                   radial-gradient(ellipse at 0% 100%,rgba(9,121,204,.32) 0%,rgba(9,121,204,0) 55%),
                   linear-gradient(160deg,#06306f 0%,#04245F 48%,#021a48 100%)}
#bgwave{position:absolute;left:0;top:0;width:1920px;height:1080px}

/* ---------- vídeo ---------- */
#video{position:absolute;left:32px;top:32px;width:1360px;height:765px;border-radius:24px;overflow:hidden;
  background:#021437}
#video:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:24px;
  border:2px solid rgba(132,217,247,.22);pointer-events:none;z-index:3}
#yt{position:absolute;left:0;top:0;width:100%;height:100%;border:0;z-index:2}
#vclick{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;background:transparent}
#vsound{position:absolute;left:50%;bottom:30px;z-index:5;display:flex;align-items:center;white-space:nowrap;
  -webkit-transform:translateX(-50%);transform:translateX(-50%);padding:14px 30px 14px 20px;border-radius:999px;
  background:rgba(2,22,56,.9);border:2px solid #F5B018;font-size:27px;font-weight:700;color:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.45)}
#vsound svg{width:42px;height:42px;margin-right:14px;flex:none}
#vsound.hide{display:none}
#vph{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#0b3a80 0%,#021437 70%)}
#vph .badge{width:220px;height:220px;border-radius:50%;background:#fff;display:flex;align-items:center;
  justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#vph .badge img{width:156px;height:auto}
#vph .vt{margin-top:28px;font-size:30px;font-weight:700;color:#DCE9FF;letter-spacing:.5px}

/* ---------- avisos ---------- */
#avisos{position:absolute;left:32px;top:821px;width:1360px;height:151px;display:flex}
.aviso{flex:1;min-width:0;margin-right:24px;border-radius:22px;background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.13);padding:20px 26px 0;overflow:hidden}
.aviso:last-child{margin-right:0}
.aviso .row{display:flex;align-items:center}
.aviso .ic{width:54px;height:54px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;
  margin-right:16px;background:linear-gradient(135deg,#1FCBF9 0%,#0867BB 100%);box-shadow:0 6px 14px rgba(0,0,0,.22)}
.aviso .ic svg{width:31px;height:31px;display:block}
.aviso .ic.chat{background:linear-gradient(135deg,#3be07e 0%,#12a14d 100%)}
.aviso .ic.estrela,.aviso .ic.etiqueta{background:linear-gradient(135deg,#ffcf57 0%,#F5B018 100%)}
.aviso h3{font-size:29px;font-weight:800;line-height:1.1;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.aviso p{font-size:20px;font-weight:500;line-height:1.3;color:#C9DCF5;margin-top:11px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- barra lateral ---------- */
#side{position:absolute;left:1416px;top:32px;width:472px;height:940px;display:flex;flex-direction:column}
.card{border-radius:24px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);
  margin-bottom:20px;position:relative;overflow:hidden;flex:none}
#brand{height:168px;background:#fff;border:0;display:flex;align-items:center;padding:0 26px}
#brand .lg{position:relative;display:block;width:130px;height:124px;margin-right:20px;flex:none;
  -webkit-animation:float 6s ease-in-out infinite;animation:float 6s ease-in-out infinite}
#brand img{height:124px;width:auto;display:block}
#brand .shine{position:absolute;left:3px;top:5px;width:114px;height:114px;border-radius:50%;overflow:hidden}
#brand .shine:after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);
  -webkit-transform:rotate(20deg);transform:rotate(20deg);
  -webkit-animation:shine 7s ease-in-out infinite;animation:shine 7s ease-in-out infinite}
#brand .spark{position:absolute;left:90px;top:14px;width:30px;height:30px;opacity:0;
  -webkit-animation:twinkle 3.5s ease-in-out infinite;animation:twinkle 3.5s ease-in-out infinite}
#brand .spark.s2{left:112px;top:46px;width:16px;height:16px;-webkit-animation-delay:1.7s;animation-delay:1.7s}
#brand .spark svg{width:100%;height:100%;display:block}
@-webkit-keyframes float{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-4px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@-webkit-keyframes shine{0%,60%{left:-60%}85%,100%{left:130%}}
@keyframes shine{0%,60%{left:-60%}85%,100%{left:130%}}
@-webkit-keyframes twinkle{0%,100%{opacity:0;-webkit-transform:scale(.3) rotate(0)}40%{opacity:1;-webkit-transform:scale(1.1) rotate(45deg)}70%{opacity:0;-webkit-transform:scale(.4) rotate(90deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1.1) rotate(45deg)}70%{opacity:0;transform:scale(.4) rotate(90deg)}}
#vph .badge{-webkit-animation:float 6s ease-in-out infinite;animation:float 6s ease-in-out infinite}
#brand .nm{font-size:50px;font-weight:800;line-height:.98;color:#04245F;letter-spacing:-1px}
#brand .nm span{display:block;color:#0979CC}
#brand .tg{font-size:16px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#5878a8;margin-top:9px}

#clock{height:248px;padding:24px 28px 0}
#greet{font-size:19px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#84D9F7;white-space:nowrap}
#time{font-size:128px;font-weight:800;line-height:1;margin-top:8px;margin-left:-6px;white-space:nowrap;letter-spacing:0}
#time .d{display:inline-block;width:.6em;text-align:center}
#time .c{display:inline-block;width:.34em;text-align:center;position:relative;top:-.09em;-webkit-transition:opacity .4s;transition:opacity .4s}
#date{font-size:27px;font-weight:500;color:#DCE9FF;margin-top:12px;white-space:nowrap}

#weather{flex:1;margin-bottom:0;padding:22px 28px 0}
#weather .hd{display:flex;justify-content:space-between;align-items:baseline}
#weather .lbl{font-size:19px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#84D9F7;white-space:nowrap}
#weather .upd{font-size:16px;font-weight:500;color:#8fb0dc;white-space:nowrap}
#weather .now{display:flex;align-items:center;margin-top:12px}
#weather .now .wi{width:116px;height:116px;flex:none;margin-right:16px;margin-left:-6px}
#weather .now .wi svg{width:116px;height:116px;display:block}
#weather .nt{min-width:0}
#weather .t{font-size:100px;font-weight:800;line-height:.95;letter-spacing:-3px}
#weather .ds{font-size:25px;font-weight:700;line-height:1.15;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#weather .stats{display:flex;margin-top:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
#weather .stats div{flex:1;text-align:center;min-width:0}
#weather .stats small{display:block;font-size:14px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#8fb0dc;white-space:nowrap}
#weather .stats strong{display:block;font-size:27px;font-weight:700;margin-top:3px;white-space:nowrap}
#weather .stats strong small{display:inline;font-size:16px;letter-spacing:0;text-transform:none;color:#C9DCF5;font-weight:500}
#weather .fc{display:flex;margin-top:16px}
#weather .day{flex:1;text-align:center;border-radius:16px;background:rgba(255,255,255,.055);margin-right:10px;padding:10px 0 11px;min-width:0}
#weather .day:last-child{margin-right:0}
#weather .dn{font-size:18px;font-weight:700;color:#DCE9FF;white-space:nowrap}
#weather .day .wi{width:54px;height:54px;margin:5px auto 3px}
#weather .day .wi svg{width:54px;height:54px;display:block}
#weather .mm{font-size:22px;font-weight:700;white-space:nowrap}
#weather .mm span{color:#8fb0dc;font-weight:500;margin-left:5px}
#weather .pp{font-size:16px;font-weight:500;color:#84D9F7;margin-top:3px;white-space:nowrap}
#weather .pp svg{width:13px;height:13px;margin-right:3px;vertical-align:-1px}
#weather .off{text-align:center;font-size:25px;font-weight:500;color:#C9DCF5;margin-top:78px;line-height:1.4}
#weather .off .wi{width:150px;height:150px;margin:0 auto 22px;opacity:.5}
#weather .off .wi svg{width:150px;height:150px;display:block}

/* ---------- faixa de notícias ---------- */
#ticker{position:absolute;left:0;top:996px;width:1920px;height:84px;background:#021638;display:flex}
#ticker:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;z-index:4;
  background:linear-gradient(90deg,#F5B018 0%,#1FCBF9 30%,#0867BB 100%)}
#tlabel{flex:none;width:232px;background:#F5B018;color:#04245F;display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:800;letter-spacing:3px;position:relative;z-index:3}
#tlabel:after{content:"";position:absolute;right:-26px;top:0;width:0;height:0;border-left:26px solid #F5B018;
  border-top:42px solid transparent;border-bottom:42px solid transparent}
#tview{flex:1;position:relative;overflow:hidden}
#tview:before{content:"";position:absolute;left:0;top:0;width:70px;height:100%;z-index:2;
  background:linear-gradient(90deg,#021638 30%,rgba(2,22,56,0) 100%)}
#track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;
}
#track.run{-webkit-animation:tick linear infinite;animation:tick linear infinite}
@-webkit-keyframes tick{from{-webkit-transform:translateX(0)}to{-webkit-transform:translateX(-50%)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.copy{display:flex;align-items:center;flex:none;padding-left:56px}
.it{display:flex;align-items:center;flex:none;font-size:31px;font-weight:500;margin-right:30px;color:#fff}
.tag{flex:none;font-size:15px;font-weight:800;letter-spacing:2px;border:2px solid #1FCBF9;color:#1FCBF9;border-radius:8px;
  padding:4px 9px 3px;margin-right:16px;line-height:1.1}
.tag.rn{border-color:#F5B018;color:#F5B018}
.tag.loja{background:#F5B018;border-color:#F5B018;color:#04245F}
.it.loja{color:#FFE7A8}
.sep{flex:none;width:22px;height:22px;margin-right:30px}
.sep svg{width:22px;height:22px;display:block}
</style>

    f.id = 'yt';
    f.src = 'https://www.youtube.com/embed/videoseries?list=' + encodeURIComponent(CONFIG.playlist) +
      '&autoplay=1&mute=1&loop=1&controls=0&rel=0&playsinline=1&iv_load_policy=3&modestbranding=1';
    f.setAttribute('frameborder', '0');
    f.setAttribute('allow', 'autoplay; encrypted-media');
    f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    var old = $('yt'); old.parentNode.replaceChild(f, old);
    setTimeout(hidePlaceholder, 4000);
  }
  (function () {
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () { setTimeout(fallbackEmbed, 5000); };
    document.getElementsByTagName('head')[0].appendChild(s);
    setTimeout(fallbackEmbed, 30000);
  })();

  // vigia: se o vídeo parar, tenta retomar, pular e, em último caso, recriar o player
  // (a página nunca é recarregada sozinha, para o som não ser bloqueado de novo)
  function rebuild() {
    if (rebuilding || !window.YT || !YT.Player) return;
    rebuilding = true;
    showPlaceholder('Carregando os vídeos…');
    try { player.destroy(); } catch (x) {}
    player = null;
    setTimeout(function () { rebuilding = false; buildPlayer(); }, 1500);
  }
  setInterval(function () {
    if (!player || !player.getPlayerState || rebuilding) return;
    var st; try { st = player.getPlayerState(); } catch (x) { return; }
    if (st === 1) { lastOk = Date.now(); return; }
    var idle = Date.now() - lastOk;
    // vídeo parado faz a TV desligar a tela: retoma rápido, nem que seja sem som
    if (idle > 120000) rebuild();
    else if (idle > 45000) { try { player.nextVideo(); } catch (x) {} }
    else if (idle > 20000 && st === 2 && soundOn) {
      soundOn = false; try { player.mute(); player.playVideo(); } catch (x) {} soundHint(true);
    }
    else if (idle > 10000) { try { player.playVideo(); } catch (x) {} }
  }, 5000);
  // manutenção: recria o player uma vez por dia, às 4h
  setInterval(function () {
    var d = nowLocal();
    if (d.getUTCHours() === 4 && d.getUTCMinutes() < 2 && Date.now() - builtAt > 3600000) rebuild();
  }, 60000);

  /* --------------------------- controle da TV --------------------------- */
  // esconde o cursor do controle depois de 4 s parado
  var idleT;
  function wake() {
    document.body.className = document.body.className.replace(/\s*idle/g, '');
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.className += ' idle'; }, 4000);
  }
  // desativado: esconder o cursor pode fazer a LG tratar a tela como "só vídeo"
  // document.addEventListener('mousemove', wake); wake();

  // apertar OK / clicar: liga o som, tenta tela cheia e garante o vídeo tocando
  function userAction() {
    // (sem pedir tela cheia: na LG isso faz o navegador esconder a página e deixar só o vídeo)
    if (!player || !player.playVideo) return;
    if (WANT_SOUND && !soundOn) trySound(true);
    else { try { player.playVideo(); } catch (x) {} }
    // celular: se ainda não começou, libera o toque direto no botão do YouTube
    setTimeout(function () {
      var st = -1; try { st = player.getPlayerState(); } catch (x) {}
      if (st !== 1 && st !== 3) { $('vclick').style.display = 'none'; hidePlaceholder(); }
    }, 2500);
  }
  document.addEventListener('click', userAction);
  document.addEventListener('keydown', function (e) { if (e.keyCode === 13) userAction(); });
})();
</script>
</body>
</html>
